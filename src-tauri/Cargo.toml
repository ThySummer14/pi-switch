[package]
name = "pi-switch-desktop"
version = "0.3.0"
description = "Desktop configuration manager for the Pi coding agent"
authors = ["Pi Switch"]
license = "MIT"
edition = "2021"

[lib]
name = "pi_switch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.8.2", features = [] }
